name: CI

on: [push, pull_request]

jobs:
  backend:
    name: Backend tests (Laravel on MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Production runs MySQL, and sqlite-based tests silently miss MySQL-only
    # failures (the fresh-install FK type mismatch in create_messages_table
    # hid behind sqlite for exactly this reason) - so CI tests on MySQL too.
    # These job-level DB_* env vars override phpunit.xml's sqlite settings,
    # same mechanism verified locally against XAMPP.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: otu_zan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: otu_zan_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create .env and application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test

  frontend:
    name: Frontend tests and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      # GitHub Actions sets CI=true, which makes react-scripts treat
      # ESLint warnings as build errors - the gate that caught the
      # unused-variable warning in DeliveryAdminDashboard.jsx.
      - name: Production build
        run: npm run build
